<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍽️ Pasti Infanzia - Menù Scuola</title>
  <meta name="description" content="Menù giornaliero della scuola dell'infanzia - Comune di Roma, Municipio 8" />
  <meta name="theme-color" content="#ec4899" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🍽️ Pasti Infanzia</h1>
    <p>Menù giornaliero · Scuola dell'infanzia · Municipio 6 (Roma)</p>
  </header>

  <main>
    <section class="card control-card">
      <label for="date">📅 Scegli la data</label>
      <div class="date-control">
        <button type="button" class="date-step-btn" id="previousDateBtn" aria-label="Giorno precedente" title="Giorno precedente">‹</button>
        <input type="text" id="date" inputmode="numeric" placeholder="gg/mm/aaaa" aria-describedby="dateHint" autocomplete="off" />
        <button type="button" class="date-step-btn" id="nextDateBtn" aria-label="Giorno successivo" title="Giorno successivo">›</button>
        <button type="button" class="date-picker-btn" id="datePickerBtn" aria-label="Apri calendario">📅</button>
        <input type="date" id="datePicker" lang="it" tabindex="-1" aria-hidden="true" />
      </div>
      <small id="dateHint">Formato: gg/mm/aaaa</small>
      <button class="btn" id="btn">🔍 Visualizza menù</button>
      <button class="btn overview-btn" id="overviewBtn" type="button" disabled>📊 Overview del mese</button>
      <div class="loader" id="loader"><span class="spinner"></span>Caricamento menù…</div>
    </section>

    <div id="error"></div>

    <section id="resultCard" class="card result-card">
      <div class="overview-modes" id="overviewModes" hidden aria-label="Modalità overview">
        <button type="button" class="overview-mode-btn active" id="groupedViewBtn" aria-pressed="true">Raggruppati per pasto</button>
        <button type="button" class="overview-mode-btn" id="dailyViewBtn" aria-pressed="false">Giorno per giorno</button>
      </div>
      <div id="menuDate" class="menu-date"></div>
      <div id="menuGrid" class="menu-grid"></div>
    </section>
  </main>

  <footer>
    Realizzato con ❤️ per i genitori · Dati da <a href="https://www.comune.roma.it" target="_blank" rel="noopener">comune.roma.it</a><br />
    Fonte: <a href="https://www.comune.roma.it/servizi/mesis-portal-reports-war/loadMenuMese.do" target="_blank" rel="noopener">MESIS Portal Reports</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
